<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Summary</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="resetutil.css" />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <main>
      <section class="wrapper">
        <div class="order-summary-card">
          <img class="hero-avatar" src="images/illustration-hero.svg" alt="Order Summary" />
          <h2 class="order-title">Order Summary</h2>
          <p class="order-details">You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>
          <div class="order-plan">
            <img src="images/icon-music.svg" alt="Music icon" />
            <p>
              Annual Plan <br />
              <span>$59.99/year</span>
            </p>
            <button type="button">Change</button>
          </div>
          <button type="button" class="order-payment-btn">Proceed to Payment</button>
          <button type="button" class="order-cancel-btn">Cancel Order</button>
        </div>
      </section>
    </main>
  </body>
</html>
