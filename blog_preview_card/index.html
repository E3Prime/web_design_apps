<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Preview Card</title>
    <link rel="stylesheet" href="resetutil.css" />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <main>
      <section class="blog-card-wrapper">
        <div class="blog-card">
          <img class="blog-img" src="assets/images/illustration-article.svg" alt="Blog card" />
          <p class="blog-topic">Learning</p>
          <p class="blog-date">Published 21 Dec 2024</p>
          <h3 class="blog-heading">HTML & CSS foundations</h3>
          <p class="blog-content">These languages are the backbone of every website, defining structure, content, and presentation.</p>
          <div class="avatar">
            <img src="assets/images/image-avatar.webp" alt="Guy" />
            <p>Greg Hooper</p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
