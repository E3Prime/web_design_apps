<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Links</title>
    <link rel="stylesheet" href="resetutil.css" />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <main>
      <section class="social-links-wrapper">
        <div class="social-links">
          <img class="avatar" src="images/avatar-jessica.jpeg" alt="Gal" width="90" height="90" />
          <h2 class="gal-name">Jessica Randall</h2>
          <p class="gal-location">London, United Kingdom</p>
          <q class="gal-quote">Front-end developer and avid reader</q>
          <button type="button" class="socials">Github</button>
          <button type="button" class="socials">Youtube</button>
          <button type="button" class="socials">LinkedIn</button>
          <button type="button" class="socials">Twitter</button>
          <button type="button" class="socials">Instagram</button>
          <button type="button" class="socials">Tiktok</button>
        </div>
      </section>
    </main>
  </body>
</html>
