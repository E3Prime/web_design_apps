<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expenses Chart</title>
    <link rel="stylesheet" href="resetutil.css" />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <main>
      <section class="wrapper">
        <div class="chart-layout">
          <div class="chart-balance">
            <p>My balance <br /><span>$921.48</span></p>
            <img src="images/logo.svg" alt="Logo" />
          </div>
          <div class="chart">
            <h3>Spending - Last 7 days</h3>
            <div class="pillars">
              <div class="pillar">
                <div class="bar bar-mon"></div>
                <span>mon</span>
              </div>
              <div class="pillar">
                <div class="bar bar-tue"></div>
                <span>tue</span>
              </div>
              <div class="pillar">
                <div class="bar bar-wed"></div>
                <span>wed</span>
              </div>
              <div class="pillar">
                <div class="bar bar-thu"></div>
                <span>thu</span>
              </div>
              <div class="pillar">
                <div class="bar bar-fri"></div>
                <span>fri</span>
              </div>
              <div class="pillar">
                <div class="bar bar-sat"></div>
                <span>sat</span>
              </div>
              <div class="pillar">
                <div class="bar bar-sun"></div>
                <span>sun</span>
              </div>
            </div>
            <hr />
            <div class="chart-results">
              <p>Total this month <br /><span class="monthly-total">$478.33</span></p>
              <div>
                <p class="percentage">+2.4%</p>
                <p>from last month</p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
